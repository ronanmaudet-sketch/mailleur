name: Diagnostic Windows Gmsh
on: create
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/diagnostic/windows-gmsh-20261117'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gmsh==4.15.2
      - run: python diagnostic/probe_gmsh_unload.py
