name: Diagnostic Rust Windows
on: create
permissions:
  contents: read
jobs:
  trace:
    if: github.ref == 'refs/heads/diagnostic/windows-rust-20261117'
    runs-on: windows-latest
    timeout-minutes: 7
    env:
      ATELIER_GMSH_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install gmsh==4.15.2
      - run: cargo build --locked --release --manifest-path rust_core/Cargo.toml
      - run: python scripts/check_native_smoke.py --output output/diagnostic --timeout 20
      - if: ${{ always() }}
        shell: python
        run: |
          from pathlib import Path
          for p in Path("output/diagnostic").rglob("native.log"):
              print(p.read_text(encoding="utf-8", errors="replace"))
