[package]
name = "mailleur-core"
version = "1.0.0-rc.10"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.83"
description = "Noyau natif Rust de l'Atelier Mailleur"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
