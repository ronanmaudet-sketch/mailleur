[package]
name = "mailleur-core"
version = "1.0.0-rc.7"
edition = "2021"
rust-version = "1.83"
description = "Noyau natif Rust de l'Atelier Mailleur"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libloading = "0.8"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
